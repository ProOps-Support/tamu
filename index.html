<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMS - Visitor Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Menggunakan Arial Narrow sebagai font utama */
        :root {
            --sky-primary: #0EA5E9;
            --sky-light: #F0F9FF;
            --sky-accent: #BAE6FD;
            --text-main: #0369A1;
        }

        body { 
            font-family: 'Arial Narrow', Arial, sans-serif; 
            background-color: #E0F2FE; 
            -webkit-font-smoothing: antialiased;
            color: #1e293b;
        }

        .nav-active { 
            background: #BAE6FD; 
            color: #0369A1 !important; 
            border-bottom: 2px solid #0EA5E9;
            border-radius: 0px;
        }
        
        .btn-primary {
            background-color: #0EA5E9;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0284C7;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-top: 4px solid #0EA5E9;
        }

        input, select, button {
            font-family: 'Arial Narrow', Arial, sans-serif !important;
        }

        .status-dot {
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        header {
            z-index: 50;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast Animation */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbt7DDol8jNbi3HERDBQ0QoKePszS_ziY",
            authDomain: "guard-d75d6.firebaseapp.com",
            projectId: "guard-d75d6",
            storageBucket: "guard-d75d6.firebasestorage.app",
            messagingSenderId: "610027210849",
            appId: "1:610027210849:web:cae057a05b36ebccc10220"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dashboard-web-v1';

        export default function App() {
            const [user, setUser] = React.useState(null);
            const [isOnline, setIsOnline] = React.useState(window.navigator.onLine);
            const [currentTime, setCurrentTime] = React.useState(new Date());
            const [activePage, setActivePage] = React.useState('log');
            const [visitors, setVisitors] = React.useState([]);
            const [employees, setEmployees] = React.useState([]);
            const [config, setConfig] = React.useState({ fonteToken: '' });
            
            const [modalType, setModalType] = React.useState(null); 
            const [password, setPassword] = React.useState('');
            const [authError, setAuthError] = React.useState('');
            const [pendingAction, setPendingAction] = React.useState(null);
            const [editingData, setEditingData] = React.useState(null);
            const [hostSelection, setHostSelection] = React.useState('');
            
            // Toast feedback
            const [toast, setToast] = React.useState(null);

            // Update Time every second
            React.useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Auto close toast
            React.useEffect(() => {
                if (toast) {
                    const timer = setTimeout(() => setToast(null), 4000);
                    return () => clearTimeout(timer);
                }
            }, [toast]);

            React.useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            React.useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                if (!user) return;
                const qV = query(collection(db, 'artifacts', appId, 'public', 'data', 'visitors'), orderBy('date', 'desc'));
                const unsubV = onSnapshot(qV, s => setVisitors(s.docs.map(d => ({id: d.id, ...d.data()}))), e => {});
                const qE = query(collection(db, 'artifacts', appId, 'public', 'data', 'employees'));
                const unsubE = onSnapshot(qE, s => setEmployees(s.docs.map(d => ({id: d.id, ...d.data()}))), e => {});
                const unsubC = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'settings'), d => {
                    if(d.exists()) setConfig(d.data());
                }, e => {});
                return () => { unsubV(); unsubE(); unsubC(); };
            }, [user]);

            const sendWAMessage = async (targetPhone, visitorData) => {
                if (!config.fonteToken) {
                    return { success: false, msg: 'Token Fonnte belum diatur di Pengaturan.' };
                }
                if (!targetPhone) {
                    return { success: false, msg: 'Nomor WhatsApp Host tidak tersedia.' };
                }
                
                // Sanitize phone number (remove any non-digits like +, space, dash)
                const cleanPhone = targetPhone.replace(/\D/g, '');

                const message = `*NOTIFIKASI TAMU BARU*\nKami informasikan terdapat tamu yang ingin bertemu dengan rincian berikut:\n\n👤 Nama: ${visitorData.name}\n🏢 Instansi: ${visitorData.company}\n🕒 Waktu: ${visitorData.appointmentTime}\n📍 Tujuan: ${visitorData.purpose}\n\nMohon segera konfirmasi ke lobby. Terima kasih.`;

                try {
                    const formData = new URLSearchParams();
                    formData.append('target', cleanPhone);
                    formData.append('message', message);

                    const response = await fetch('https://api.fonnte.com/send', {
                        method: 'POST',
                        headers: { 'Authorization': config.fonteToken },
                        body: formData
                    });

                    const data = await response.json();
                    if (data.status) {
                        return { success: true, msg: 'Notifikasi WA terkirim ke host.' };
                    } else {
                        return { success: false, msg: 'Fonnte: ' + (data.reason || 'Gagal mengirim') };
                    }
                } catch (err) {
                    console.error("WA Error:", err);
                    return { success: false, msg: 'Kesalahan jaringan saat mengirim WA.' };
                }
            };

            const handleCheckIn = async (e) => {
                e.preventDefault();
                if (!user) return;
                const fd = new FormData(e.target);
                const hostId = fd.get('hostId');
                let hostName = '';
                let hostPhone = '';

                if (hostId === 'manual') {
                    hostName = fd.get('hostManual');
                    hostPhone = '';
                } else {
                    const selectedEmp = employees.find(emp => emp.id === hostId);
                    hostName = selectedEmp ? selectedEmp.name : 'Umum';
                    hostPhone = selectedEmp ? selectedEmp.phone : '';
                }
                
                const visitorData = {
                    name: fd.get('name'), company: fd.get('company'), 
                    host: hostName, hostPhone: hostPhone,
                    appointmentTime: fd.get('appointmentTime'), purpose: fd.get('purpose'),
                    status: 'Check-In', timeIn: new Date().toISOString(), date: new Date().toISOString()
                };

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'visitors'), visitorData);
                    
                    if (hostPhone) {
                        const result = await sendWAMessage(hostPhone, visitorData);
                        setToast({ 
                            type: result.success ? 'success' : 'error', 
                            message: result.msg 
                        });
                    } else {
                        setToast({ type: 'success', message: 'Tamu terdaftar (Tanpa WA Host).' });
                    }
                    
                    e.target.reset();
                    setHostSelection('');
                } catch (err) { 
                    console.error("Check-in error:", err);
                    setToast({ type: 'error', message: 'Gagal menyimpan data ke database.' });
                }
            };

            const handleCheckOut = async (id) => {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'visitors', id), {
                        status: 'Closed',
                        timeOut: new Date().toISOString()
                    });
                    setToast({ type: 'success', message: 'Tamu telah Check-Out.' });
                } catch (err) {
                    console.error("Gagal Check-Out:", err);
                }
            };

            const verifyPassword = () => {
                if (password === 'admin123') {
                    const action = pendingAction;
                    setAuthError(''); setPassword(''); setModalType(null); setPendingAction(null);
                    if (action) action();
                } else { setAuthError('Password Salah!'); }
            };

            const triggerProtectedAction = (action) => {
                setPendingAction(() => action);
                setModalType('auth');
            };

            const saveEmployee = async (e) => {
                e.preventDefault();
                if (!user) return;
                const fd = new FormData(e.target);
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), { 
                    name: fd.get('name'), 
                    phone: fd.get('phone').replace(/\D/g, '') // Sanitize on save
                });
                setToast({ type: 'success', message: 'Karyawan berhasil ditambahkan.' });
                e.target.reset();
            };

            const deleteEmployee = async (id) => {
                if (!user) return;
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'employees', id));
                setToast({ type: 'success', message: 'Data karyawan dihapus.' });
            };

            const updateConfig = async (e) => {
                e.preventDefault();
                if (!user) return;
                const fd = new FormData(e.target);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'settings'), { fonteToken: fd.get('token') });
                setToast({ type: 'success', message: 'Konfigurasi WA diperbarui.' });
            };

            if (!user) return (
                <div className="flex flex-col h-screen items-center justify-center bg-[#E0F2FE] gap-4">
                    <div className="animate-spin text-[#0EA5E9] text-4xl"><i className="fas fa-circle-notch"></i></div>
                    <p className="text-[#0369A1] font-bold tracking-tight uppercase">Menghubungkan VMS...</p>
                </div>
            );

            const formattedDate = currentTime.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
            const formattedTime = currentTime.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-[200] animate-fade-in">
                            <div className={`flex items-center gap-3 px-6 py-4 rounded-2xl shadow-2xl border ${toast.type === 'success' ? 'bg-emerald-500 border-emerald-400 text-white' : 'bg-rose-500 border-rose-400 text-white'}`}>
                                <i className={`fas ${toast.type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}`}></i>
                                <span className="font-bold text-sm uppercase tracking-wide">{toast.message}</span>
                                <button onClick={() => setToast(null)} className="ml-4 opacity-50 hover:opacity-100"><i className="fas fa-times"></i></button>
                            </div>
                        </div>
                    )}

                    {/* Header Navigation */}
                    <header className="sticky top-0 w-full bg-white border-b border-sky-100 shadow-sm">
                        <div className="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-[#0EA5E9] text-white w-7 h-7 rounded flex items-center justify-center shadow-sm">
                                    <i className="fas fa-shield-alt text-xs"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-black text-[#0369A1] leading-none tracking-tighter">VMS</h1>
                                    <p className="text-[7px] text-[#0EA5E9] italic font-bold -mt-0.5 opacity-80 uppercase tracking-tighter hidden sm:block">Visitor Management System</p>
                                </div>
                            </div>
                            
                            <nav className="flex items-center h-full gap-1">
                                <button onClick={() => setActivePage('log')} className={`flex items-center gap-1.5 px-4 h-full text-xs font-bold transition-all ${activePage === 'log' ? 'nav-active' : 'text-slate-400 hover:text-[#0369A1] hover:bg-sky-50'}`}>
                                    <i className="fas fa-list-ul text-[10px]"></i>
                                    <span>Log Tamu</span>
                                </button>
                                <button onClick={() => triggerProtectedAction(() => setActivePage('employees'))} className={`flex items-center gap-1.5 px-4 h-full text-xs font-bold transition-all ${activePage === 'employees' ? 'nav-active' : 'text-slate-400 hover:text-[#0369A1] hover:bg-sky-50'}`}>
                                    <i className="fas fa-user-friends text-[10px]"></i>
                                    <span>Karyawan</span>
                                </button>
                                <button onClick={() => triggerProtectedAction(() => setActivePage('settings'))} className={`flex items-center gap-1.5 px-4 h-full text-xs font-bold transition-all ${activePage === 'settings' ? 'nav-active' : 'text-slate-400 hover:text-[#0369A1] hover:bg-sky-50'}`}>
                                    <i className="fas fa-cog text-[10px]"></i>
                                    <span>Pengaturan</span>
                                </button>
                            </nav>

                            <div className="flex items-center gap-4 lg:gap-6">
                                <div className="hidden sm:flex flex-col items-end border-r border-sky-100 pr-4">
                                    <p className="text-[10px] font-black text-[#0369A1] tracking-tight uppercase leading-none">{formattedDate}</p>
                                    <p className="text-[12px] font-black text-[#0EA5E9] tracking-widest mt-0.5 leading-none">{formattedTime}</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <p className={`text-[10px] font-black tracking-tighter hidden lg:block ${isOnline ? 'text-green-600' : 'text-red-600'}`}>
                                        {isOnline ? 'ONLINE' : 'OFFLINE'}
                                    </p>
                                    <div className={`w-2 h-2 rounded-full status-dot ${isOnline ? 'bg-green-500' : 'bg-red-500 animate-pulse'}`}></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {activePage === 'log' && (
                            <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in duration-500">
                                <div className="lg:col-span-4 space-y-6">
                                    <div className="glass-card p-6 rounded-2xl shadow-lg">
                                        <h2 className="font-extrabold text-xl mb-4 flex items-center gap-2 text-[#0369A1] tracking-tight">
                                            <i className="fas fa-file-signature text-[#0EA5E9]"></i> Registrasi Tamu
                                        </h2>
                                        <form onSubmit={handleCheckIn} className="space-y-4">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest ml-1">Nama Pengunjung</label>
                                                <input name="name" required placeholder="Nama Lengkap" className="w-full bg-sky-50/50 p-3 rounded-lg border border-sky-100 focus:border-[#0EA5E9] focus:bg-white outline-none transition-all font-semibold text-sm"/>
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest ml-1">Instansi</label>
                                                <input name="company" required placeholder="Nama Perusahaan" className="w-full bg-sky-50/50 p-3 rounded-lg border border-sky-100 focus:border-[#0EA5E9] focus:bg-white outline-none transition-all font-semibold text-sm"/>
                                            </div>
                                            
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest ml-1">Karyawan (Host)</label>
                                                <select 
                                                    name="hostId" required value={hostSelection}
                                                    onChange={(e) => setHostSelection(e.target.value)}
                                                    className="w-full bg-sky-50/50 p-3 rounded-lg border border-sky-100 focus:border-[#0EA5E9] focus:bg-white outline-none appearance-none transition-all font-semibold text-sm"
                                                >
                                                    <option value="">-- Pilih Host --</option>
                                                    <option value="manual" className="font-bold text-[#0EA5E9] italic">Ketik Manual...</option>
                                                    {employees.map(emp => ( <option key={emp.id} value={emp.id}>{emp.name}</option> ))}
                                                </select>
                                            </div>
                                            {hostSelection === 'manual' && (
                                                <div className="space-y-1 animate-fade-in">
                                                    <label className="text-[10px] font-extrabold text-[#0EA5E9] uppercase tracking-widest ml-1">Nama Host Manual</label>
                                                    <input name="hostManual" required placeholder="Masukkan Nama Host" className="w-full bg-white p-3 rounded-lg border-2 border-[#BAE6FD] focus:border-[#0EA5E9] outline-none transition-all font-bold text-sm shadow-inner"/>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-2 gap-3">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest ml-1">Waktu</label>
                                                    <input type="time" name="appointmentTime" required className="w-full bg-sky-50/50 p-3 rounded-lg border border-sky-100 focus:border-[#0EA5E9] focus:bg-white outline-none font-bold text-sm"/>
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest ml-1">Tujuan</label>
                                                    <select name="purpose" className="w-full bg-sky-50/50 p-3 rounded-lg border border-sky-100 focus:border-[#0EA5E9] focus:bg-white outline-none appearance-none font-bold text-sm">
                                                        <option>Meeting</option><option>Interview</option><option>Paket</option><option>Pribadi</option><option>Lainnya</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <button className="w-full bg-[#0EA5E9] text-white py-4 rounded-xl font-extrabold text-base hover:bg-[#0284C7] shadow-md shadow-sky-200 transition-all active:scale-95 mt-4 tracking-tight uppercase text-center">Simpan & Kirim WA</button>
                                        </form>
                                    </div>
                                </div>

                                <div className="lg:col-span-8">
                                    <div className="glass-card p-6 rounded-2xl shadow-lg min-h-[500px] flex flex-col">
                                        <div className="flex justify-between items-center mb-6 pb-3 border-b border-sky-50">
                                            <div>
                                                <h2 className="font-extrabold text-xl text-[#0369A1] tracking-tight">Log Kunjungan Terbaru</h2>
                                                <p className="text-slate-400 text-[10px] font-bold mt-0.5 uppercase tracking-widest">Antarmuka Pencatatan Real-time</p>
                                            </div>
                                            <button onClick={() => triggerProtectedAction(async () => {
                                                const batch = visitors.map(v => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'visitors', v.id)));
                                                await Promise.all(batch);
                                                setToast({ type: 'success', message: 'Semua data log telah dihapus.' });
                                            })} className="text-red-500 bg-red-50 px-4 py-2 rounded-lg text-[10px] font-black hover:bg-red-500 hover:text-white transition-all uppercase tracking-widest border border-red-100">Hapus Semua</button>
                                        </div>
                                        <div className="overflow-x-auto flex-1">
                                            <table className="w-full text-sm">
                                                <thead>
                                                    <tr className="text-[#0369A1] font-extrabold uppercase text-[9px] tracking-widest border-b border-sky-50">
                                                        <th className="pb-3 px-2 text-left">Pengunjung</th><th className="pb-3 px-2 text-center">Host Tujuan</th><th className="pb-3 px-2 text-center">Jadwal / Masuk</th><th className="pb-3 px-2 text-right">Aksi</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-sky-50">
                                                    {visitors.map(v => (
                                                        <tr key={v.id} className="hover:bg-sky-50/50 transition-all group">
                                                            <td className="py-4 px-2">
                                                                <div className="font-extrabold text-[#0369A1] text-sm leading-tight">{v.name}</div>
                                                                <div className="text-[10px] text-slate-400 font-bold flex items-center gap-1 mt-1 italic"><i className="fas fa-building text-sky-300"></i> {v.company}</div>
                                                                <div className="mt-1">
                                                                    <span className={`text-[8px] font-black px-1.5 py-0.5 rounded uppercase tracking-tighter ${v.status === 'Check-In' ? 'bg-sky-100 text-[#0369A1]' : 'bg-slate-100 text-slate-400'}`}>{v.status}</span>
                                                                </div>
                                                            </td>
                                                            <td className="py-4 px-2 text-center">
                                                                <div className="text-[#0369A1] font-bold text-sm">👤 {v.host}</div>
                                                                <div className="text-[9px] text-slate-400 font-bold tracking-tighter italic">{v.hostPhone || 'Manual'}</div>
                                                            </td>
                                                            <td className="py-4 px-2 text-center">
                                                                <div className="font-black text-[#0369A1] text-base">{v.appointmentTime}</div>
                                                                <div className="text-[8px] text-slate-400">In: {new Date(v.timeIn).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</div>
                                                            </td>
                                                            <td className="py-4 px-2 text-right">
                                                                <div className="flex justify-end gap-2">
                                                                    {v.status === 'Check-In' && (
                                                                        <button 
                                                                            onClick={() => handleCheckOut(v.id)}
                                                                            className="bg-[#0369A1] text-white px-3 py-1 rounded text-[9px] font-bold hover:bg-[#0EA5E9] transition-all"
                                                                        >
                                                                            Out
                                                                        </button>
                                                                    )}
                                                                    <button onClick={() => triggerProtectedAction(() => { setEditingData(v); setModalType('edit-visitor'); })} className="text-[#0EA5E9] w-8 h-8 hover:bg-[#0EA5E9] hover:text-white rounded-lg transition-all flex items-center justify-center border border-sky-100"><i className="fas fa-edit text-[10px]"></i></button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    {visitors.length === 0 && (
                                                        <tr><td colSpan="4" className="py-20 text-center text-slate-300"><i className="fas fa-folder-open text-4xl mb-2"></i><p className="font-extrabold uppercase text-[10px] tracking-widest">Belum Ada Data</p></td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activePage === 'employees' && (
                            <div className="max-w-4xl mx-auto animate-in fade-in slide-in-from-bottom-6 duration-500">
                                <div className="flex justify-between items-end mb-8 pb-3 border-b-2 border-sky-100">
                                    <div><h2 className="text-3xl font-black text-[#0369A1] tracking-tighter">Database Karyawan</h2><p className="text-[#0EA5E9] font-bold mt-1 uppercase text-[10px] tracking-widest">Manajemen Host Penerima Tamu</p></div>
                                    <button onClick={() => setModalType('add-employee')} className="bg-[#0EA5E9] text-white px-6 py-3 rounded-xl font-black shadow hover:bg-[#0369A1] transition-all transform active:scale-95 uppercase text-xs tracking-widest"><i className="fas fa-plus mr-1"></i> Tambah Karyawan</button>
                                </div>
                                <div className="glass-card rounded-2xl shadow-xl overflow-hidden border-0">
                                    <table className="w-full text-sm">
                                        <thead className="bg-sky-50 text-[#0369A1] uppercase text-[9px] tracking-widest font-black">
                                            <tr><th className="p-4 text-left">Nama Lengkap</th><th className="p-4 text-left">Nomor WhatsApp</th><th className="p-4 text-right">Menu</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-sky-50">
                                            {employees.map(emp => (
                                                <tr key={emp.id} className="hover:bg-sky-50/50 transition-colors">
                                                    <td className="p-4 font-extrabold text-[#0369A1] flex items-center gap-3 text-sm"><div className="w-8 h-8 rounded-lg bg-sky-100 text-[#0EA5E9] flex items-center justify-center font-black text-xs">{emp.name.charAt(0)}</div>{emp.name}</td>
                                                    <td className="p-4 font-black text-slate-500 text-sm">{emp.phone}</td>
                                                    <td className="p-4 text-right"><button onClick={() => deleteEmployee(emp.id)} className="w-8 h-8 text-red-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all"><i className="fas fa-trash-alt text-xs"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activePage === 'settings' && (
                            <div className="max-w-xl mx-auto animate-in zoom-in duration-500">
                                <h2 className="text-3xl font-black text-[#0369A1] mb-8 tracking-tighter text-center">Konfigurasi Sistem</h2>
                                <div className="glass-card p-8 rounded-2xl shadow-xl">
                                    <div className="mb-8 flex items-center gap-4 p-4 bg-sky-50 rounded-xl border-l-4 border-[#0EA5E9]">
                                        <div className="bg-[#0EA5E9] text-white w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 shadow-sm"><i className="fas fa-key text-sm"></i></div>
                                        <p className="text-[10px] text-[#0369A1] leading-relaxed font-extrabold uppercase">Masukan Token API Fonnte untuk notifikasi otomatis via WhatsApp.</p>
                                    </div>
                                    <form onSubmit={updateConfig} className="space-y-6">
                                        <div className="space-y-1.5">
                                            <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Fonnte Access Token</label>
                                            <input name="token" type="password" defaultValue={config.fonteToken} placeholder="Masukkan Token Fonnte" className="w-full bg-sky-50/30 p-4 rounded-xl border border-sky-100 focus:border-[#0EA5E9] outline-none font-bold text-base shadow-inner transition-all"/>
                                        </div>
                                        <button className="w-full bg-[#0369A1] text-white py-4 rounded-xl font-black text-base hover:bg-[#0EA5E9] shadow-md transition-all active:scale-95 tracking-tight uppercase">Simpan Perubahan</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modals */}
                    {modalType && (
                        <div className="fixed inset-0 bg-sky-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            {modalType === 'auth' && (
                                <div className="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl text-center animate-in zoom-in duration-300 border-t-4 border-[#0EA5E9]">
                                    <div className="w-16 h-16 bg-sky-50 text-[#0EA5E9] rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl"><i className="fas fa-user-lock"></i></div>
                                    <h3 className="text-xl font-black text-[#0369A1] tracking-tighter uppercase">Otorisasi Admin</h3>
                                    <p className="text-slate-400 font-bold mt-1 mb-6 uppercase text-[9px]">Masukkan Password Administrator</p>
                                    <input type="password" autoFocus value={password} onChange={e => setPassword(e.target.value)} placeholder="••••" className="w-full bg-sky-50 p-4 rounded-xl text-center text-3xl tracking-[0.3em] mb-3 focus:ring-2 focus:ring-sky-100 outline-none border-0 font-black text-[#0369A1]" onKeyDown={e => e.key === 'Enter' && verifyPassword()}/>
                                    {authError && <p className="text-red-500 text-[10px] font-black mb-4 uppercase">{authError}</p>}
                                    <div className="flex gap-3"><button onClick={() => setModalType(null)} className="flex-1 py-3 text-slate-400 font-black uppercase text-[10px]">Batal</button><button onClick={verifyPassword} className="flex-1 bg-[#0369A1] text-white py-3 rounded-lg font-black shadow-md uppercase text-[10px]">Verifikasi</button></div>
                                </div>
                            )}
                            
                            {modalType === 'add-employee' && (
                                <div className="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl animate-in zoom-in duration-200 border-t-4 border-[#0EA5E9]">
                                    <h3 className="text-lg font-black text-[#0369A1] mb-6 tracking-tight text-center uppercase">Karyawan Baru</h3>
                                    <form onSubmit={(e) => { saveEmployee(e); setModalType(null); }} className="space-y-4 text-left">
                                        <div className="space-y-1"><label className="text-[9px] font-black text-slate-400 uppercase ml-1">Nama Lengkap</label><input name="name" required placeholder="Budi Santoso" className="w-full bg-sky-50 p-3 rounded-lg border border-sky-100 outline-none focus:ring-2 focus:ring-sky-100 font-bold text-sm"/></div>
                                        <div className="space-y-1"><label className="text-[9px] font-black text-slate-400 uppercase ml-1">WhatsApp (62...)</label><input name="phone" required placeholder="62812..." className="w-full bg-sky-50 p-3 rounded-lg border border-sky-100 outline-none focus:ring-2 focus:ring-sky-100 font-black tracking-wider text-sm"/></div>
                                        <div className="flex gap-3 pt-4"><button type="button" onClick={() => setModalType(null)} className="flex-1 py-3 text-slate-400 font-black uppercase text-[10px]">Batal</button><button type="submit" className="flex-1 bg-[#0EA5E9] text-white py-3 rounded-lg font-black shadow uppercase text-[10px]">Simpan</button></div>
                                    </form>
                                </div>
                            )}

                            {modalType === 'edit-visitor' && editingData && (
                                <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl animate-in zoom-in duration-200 border-t-4 border-[#0369A1]">
                                    <h3 className="text-lg font-black text-[#0369A1] mb-6 tracking-tight text-center uppercase">Edit Log Tamu</h3>
                                    <form onSubmit={async (e) => {
                                        e.preventDefault(); const fd = new FormData(e.target);
                                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'visitors', editingData.id), { name: fd.get('name'), company: fd.get('company'), appointmentTime: fd.get('time') });
                                        setToast({ type: 'success', message: 'Data log tamu berhasil diperbarui.' });
                                        setModalType(null);
                                    }} className="space-y-4 text-left">
                                        <div className="space-y-1"><label className="text-[9px] font-black text-slate-400 uppercase ml-1">Nama Pengunjung</label><input name="name" defaultValue={editingData.name} className="w-full bg-sky-50 p-3 rounded-lg border border-sky-100 outline-none focus:ring-2 focus:ring-sky-100 font-bold text-sm"/></div>
                                        <div className="space-y-1"><label className="text-[9px] font-black text-slate-400 uppercase ml-1">Instansi</label><input name="company" defaultValue={editingData.company} className="w-full bg-sky-50 p-3 rounded-lg border border-sky-100 outline-none focus:ring-2 focus:ring-sky-100 font-bold text-sm"/></div>
                                        <div className="space-y-1"><label className="text-[9px] font-black text-slate-400 uppercase ml-1">Waktu</label><input type="time" name="time" defaultValue={editingData.appointmentTime} className="w-full bg-sky-50 p-3 rounded-lg border border-sky-100 outline-none focus:ring-2 focus:ring-sky-100 font-bold text-sm"/></div>
                                        <div className="flex gap-3 pt-4"><button type="button" onClick={() => setModalType(null)} className="flex-1 py-3 text-slate-400 font-black uppercase text-[10px]">Batal</button><button type="submit" className="flex-1 bg-[#0369A1] text-white py-3 rounded-lg font-black shadow-lg uppercase text-[10px]">Update</button></div>
                                    </form>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
